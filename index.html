    <script>
        let ticking = false;
        function updateBackground() {
            const scroll = window.scrollY;

            // --------------------------------
            // BLUR
            // --------------------------------

            const blur = Math.max(3 - scroll / 500, 0);

            // --------------------------------
            // PARALLAX
            // --------------------------------
            //
            // Por cada 100px que bajas,
            // el fondo sube 4px.
            //
            // No existe límite: continúa
            // durante toda la página.
            //

            const parallax = -(scroll * 0.04);

            document.body.style.setProperty('--blur-fondo', `${blur}px`);
            document.body.style.setProperty('--parallax-fondo', `${parallax}px`);

            ticking = false;
        }

        let scrollDiv = document.getElementById("scrollMessage");
        window.addEventListener('scroll',() => {
          if (!ticking) {
            requestAnimationFrame(updateBackground);
            let value = window.scrollY;

            scrollDiv.style.bottom = 100 + value / 8 + 'px';

            ticking = true;
          }

          },
          { passive: true }
        );


        updateBackground();
    </script>
